<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunger Creative v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --hunger-primary: #15803d;
            --hunger-light: #dcfce7;
            --hunger-mid: #bbf7d0;
            --hunger-accent: #4ade80;
            --stress-primary: #c2410c;
            --stress-light: #fff7ed;
            --stress-mid: #fed7aa;
            --stress-accent: #fb923c;
            --boredom-primary: #4338ca;
            --boredom-light: #eef2ff;
            --boredom-mid: #c7d2fe;
            --boredom-accent: #818cf8;
            --temptation-primary: #b45309;
            --temptation-light: #fef3c7;
            --temptation-mid: #fde68a;
            --temptation-accent: #fbbf24;
            --reward-primary: #7c3aed;
            --reward-light: #ede9fe;
            --reward-mid: #ddd6fe;
            --reward-accent: #a78bfa;
            --social-primary: #0f766e;
            --social-light: #f0fdfa;
            --social-mid: #99f6e4;
            --social-accent: #2dd4bf;
            --mode-primary: #15803d;
            --mode-light: #dcfce7;
            --mode-mid: #bbf7d0;
            --mode-accent: #4ade80;
            --text-dark: #1a1a2e;
            --text-mid: #4a4a6a;
            --text-light: #8888aa;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #fafaf8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* ─── Noise texture overlay ─── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
        }

        .app-shell {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
        }

        /* ─── Logo strip ─── */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-title {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-dark);
            line-height: 1;
        }
        .logo-title span {
            font-style: italic;
            font-weight: 300;
        }
        .logo-sub {
            font-size: 0.72rem;
            color: var(--text-light);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        /* ─── Mode selector ─── */
        #screen-select { animation: fadeIn 0.4s ease; }

        .select-label {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-mid);
            margin-bottom: 1.2rem;
            letter-spacing: 0.05em;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        .mode-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.55rem;
            padding: 0.9rem 1rem;
            border-radius: 16px;
            border: 2px solid transparent;
            background: white;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .mode-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .mode-card:active { transform: scale(0.97); }

        .mode-card.hunger  { border-color: var(--hunger-mid);  }
        .mode-card.stress  { border-color: var(--stress-mid);  }
        .mode-card.boredom { border-color: var(--boredom-mid); }
        .mode-card.temptation { border-color: var(--temptation-mid); }
        .mode-card.reward  { border-color: var(--reward-mid);  }
        .mode-card.social  { border-color: var(--social-mid);  }

        .mode-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .mode-card.hunger  .mode-icon { background: var(--hunger-light);  }
        .mode-card.stress  .mode-icon { background: var(--stress-light);  }
        .mode-card.boredom .mode-icon { background: var(--boredom-light); }
        .mode-card.temptation .mode-icon { background: var(--temptation-light); }
        .mode-card.reward  .mode-icon { background: var(--reward-light);  }
        .mode-card.social  .mode-icon { background: var(--social-light);  }

        .mode-text-wrap {}
        .mode-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
        }
        .mode-desc {
            font-size: 0.65rem;
            color: var(--text-light);
            margin-top: 0.1rem;
            line-height: 1.4;
        }

        /* ─── Idea screen ─── */
        #screen-idea { display: none; animation: fadeIn 0.4s ease; }
        #screen-idea.active { display: block; }

        .mode-badge-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.9rem;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-back {
            background: none; border: none; cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-light);
            display: flex; align-items: center; gap: 0.3rem;
            transition: color 0.2s;
        }
        .btn-back:hover { color: var(--text-dark); }

        .idea-panel {
            background: white;
            border-radius: 24px;
            padding: 2rem 1.8rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            border: 2px solid var(--mode-mid);
            min-height: 280px;
            position: relative;
            overflow: hidden;
        }
        .idea-panel::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--mode-light);
            opacity: 0.7;
        }

        .idea-tag {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: var(--mode-light);
            color: var(--mode-primary);
            margin-bottom: 1rem;
        }

        .idea-title {
            font-family: 'Fraunces', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.35;
            margin-bottom: 1.1rem;
            position: relative; z-index: 1;
        }

        .idea-body {
            font-size: 0.82rem;
            color: var(--text-mid);
            line-height: 1.85;
        }
        .idea-body strong { color: var(--mode-primary); font-weight: 700; }

        .idea-step {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.8rem;
        }
        .step-num {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--mode-light);
            color: var(--mode-primary);
            font-size: 0.65rem;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        /* ─── Buttons ─── */
        .btn-generate {
            width: 100%;
            margin-top: 1.2rem;
            padding: 1rem;
            border: none;
            border-radius: 16px;
            background: var(--mode-primary);
            color: white;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s, background 0.3s;
            box-shadow: 0 4px 16px color-mix(in srgb, var(--mode-primary) 30%, transparent);
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in srgb, var(--mode-primary) 35%, transparent); }
        .btn-generate:active { transform: scale(0.96); }

        .tip-box {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            background: var(--mode-light);
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--mode-primary);
            line-height: 1.6;
            display: none;
        }
        .tip-box.visible { display: block; animation: fadeIn 0.3s ease; }
        .tip-box strong { font-weight: 700; }

        /* ─── Copy area ─── */
        .copy-area {
            margin-top: 1rem;
            border: 1.5px dashed var(--mode-mid);
            border-radius: 14px;
            padding: 0.85rem 1rem;
            background: var(--mode-light);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .copy-area.visible { display: block; }

        .copy-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .copy-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--mode-primary);
            display: flex; align-items: center; gap: 0.3rem;
        }
        .char-count {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--mode-primary);
            background: white;
            border-radius: 100px;
            padding: 0.15rem 0.55rem;
            border: 1.5px solid var(--mode-mid);
        }
        .char-count.over { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }

        .copy-preview {
            font-size: 0.75rem;
            color: var(--text-mid);
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 0.7rem;
        }

        .btn-copy {
            width: 100%;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 10px;
            background: white;
            border: 1.5px solid var(--mode-mid);
            color: var(--mode-primary);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: var(--mode-primary); color: white; border-color: var(--mode-primary); }
        .btn-copy:active { transform: scale(0.97); }
        .btn-copy.copied { background: var(--mode-primary); color: white; border-color: var(--mode-primary); }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #1a1a2e;
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            white-space: nowrap;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ─── Utility ─── */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideCard { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
        .slide-card { animation: slideCard 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }

        /* ─── Color theming by mode ─── */
        body[data-mode="hunger"]  { --mode-primary: var(--hunger-primary);  --mode-light: var(--hunger-light);  --mode-mid: var(--hunger-mid);  --mode-accent: var(--hunger-accent);  }
        body[data-mode="stress"]  { --mode-primary: var(--stress-primary);  --mode-light: var(--stress-light);  --mode-mid: var(--stress-mid);  --mode-accent: var(--stress-accent);  }
        body[data-mode="boredom"] { --mode-primary: var(--boredom-primary); --mode-light: var(--boredom-light); --mode-mid: var(--boredom-mid); --mode-accent: var(--boredom-accent); }
        body[data-mode="temptation"] { --mode-primary: var(--temptation-primary); --mode-light: var(--temptation-light); --mode-mid: var(--temptation-mid); --mode-accent: var(--temptation-accent); }
        body[data-mode="reward"]  { --mode-primary: var(--reward-primary);  --mode-light: var(--reward-light);  --mode-mid: var(--reward-mid);  --mode-accent: var(--reward-accent);  }
        body[data-mode="social"]  { --mode-primary: var(--social-primary);  --mode-light: var(--social-light);  --mode-mid: var(--social-mid);  --mode-accent: var(--social-accent);  }
    </style>
</head>
<body>
<div class="app-shell">

    <div class="logo">
        <div class="logo-title">Hunger <span>Creative</span></div>
        <div class="logo-sub">食欲を、エネルギーに変える</div>
    </div>

    <!-- ① モード選択画面 -->
    <div id="screen-select">
        <p class="select-label">今の状態に近いものを選んでください</p>
        <div class="mode-grid">
            <div class="mode-card hunger" onclick="selectMode('hunger')">
                <div class="mode-icon">🌿</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">お腹が空いている</div>
                    <div class="mode-desc">生理的な空腹・食事前・断食中</div>
                </div>
            </div>
            <div class="mode-card stress" onclick="selectMode('stress')">
                <div class="mode-icon">🔥</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">ストレスで食べたい</div>
                    <div class="mode-desc">感情的・衝動的・イライラ・もやもや</div>
                </div>
            </div>
            <div class="mode-card boredom" onclick="selectMode('boredom')">
                <div class="mode-icon">💤</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">なんとなく口が寂しい</div>
                    <div class="mode-desc">暇つぶし・習慣・手持ち無沙汰</div>
                </div>
            </div>
            <div class="mode-card temptation" onclick="selectMode('temptation')">
                <div class="mode-icon">👀</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">おいしそうなものが目に入った</div>
                    <div class="mode-desc">視覚的誘惑・SNS映え・衝動買い食い</div>
                </div>
            </div>
            <div class="mode-card reward" onclick="selectMode('reward')">
                <div class="mode-icon">🏆</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">頑張ったからご褒美に食べたい</div>
                    <div class="mode-desc">達成感・自己許可・解放感</div>
                </div>
            </div>
            <div class="mode-card social" onclick="selectMode('social')">
                <div class="mode-icon">👥</div>
                <div class="mode-text-wrap">
                    <div class="mode-name">場の空気で食べてしまいそう</div>
                    <div class="mode-desc">同調圧力・勧められた・飲み会</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ② アイデア表示画面 -->
    <div id="screen-idea">
        <div class="mode-badge-bar">
            <div class="mode-badge" id="badge"></div>
            <button class="btn-back" onclick="goBack()">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2L4 6L8 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                モード選択に戻る
            </button>
        </div>

        <div class="idea-panel" id="idea-panel">
            <div class="idea-tag" id="idea-tag"></div>
            <h2 class="idea-title" id="idea-title"></h2>
            <div class="idea-body" id="idea-body"></div>
        </div>

        <!-- X投稿用コピーエリア -->
        <div class="copy-area" id="copy-area">
            <div class="copy-header">
                <div class="copy-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    X（旧Twitter）用テキスト
                </div>
                <div class="char-count" id="char-count">0 / 140</div>
            </div>
            <div class="copy-preview" id="copy-preview"></div>
            <button class="btn-copy" id="btn-copy" onclick="copyTweet()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                <span id="copy-btn-label">テキストをコピー</span>
            </button>
        </div>

        <button class="btn-generate" onclick="nextIdea()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
            別のアイデアを見る
        </button>

        <div class="tip-box" id="tip-box"></div>
    </div>

</div>

<!-- トースト通知 -->
<div class="toast" id="toast">✓ コピーしました！Xに貼り付けてください</div>

<script>
const IDEAS = {
    hunger: {
        badge: { emoji: '🌿', label: '空腹モード', style: 'color: #15803d; background: #dcfce7;' },
        tip: '💡 空腹は「体内工事中」のサインです。30分だけ別のことに意識を向けてみると、自然と収まることが多いです。',
        items: [
            {
                tag: 'オートファジー',
                title: '体内の大規模リノベをイメージする',
                steps: [
                    '古くなったタンパク質が今この瞬間、細胞の燃料として再利用されています。',
                    'これは「体が消えているサイン」ではなく、<strong>細胞が若返っている通知</strong>です。',
                    'お腹の感覚を「鳴き声」ではなく「工事の音」として聞いてみてください。'
                ]
            },
            {
                tag: '五感の研ぎ澄まし',
                title: '嗅覚テイスティングを実施する',
                steps: [
                    '空腹時は嗅覚と味覚が鋭敏になります。これは生存本能のピーク状態です。',
                    '遠くのコーヒーや食事の香りを、あえて深く嗅いで<strong>香りの層を分解</strong>してみましょう。',
                    '次の食事を音・温度・食感まで頭の中で完璧にシミュレートします。'
                ]
            },
            {
                tag: '思考の透明度',
                title: '重いタスクを今すぐ攻略する',
                steps: [
                    '消化にエネルギーを奪われていないため、今が<strong>脳のゴールデンタイム</strong>です。',
                    '先延ばしにしていたクリエイティブな仕事や思考系の作業に今すぐ着手しましょう。',
                    '「空腹が冴えをもたらしている」というメタ認知が作業効率をさらに高めます。'
                ]
            },
            {
                tag: '内臓洗車',
                title: 'こだわりの水分で浄化儀式',
                steps: [
                    'ただの水分補給を、体内を清める<strong>丁寧な儀式</strong>に昇格させます。',
                    '常温水・炭酸水・香りのよいお茶など、テクスチャーを意識しながらゆっくり飲む。',
                    '胃壁を通り抜けていく清涼感に集中すると、空腹感が遠のいていきます。'
                ]
            },
            {
                tag: '脂肪燃焼',
                title: '自前の燃料で動いている感覚を楽しむ',
                steps: [
                    '軽く体を動かしてみましょう。今使われているのは<strong>自分自身の蓄積エネルギー</strong>です。',
                    '「外からの燃料なしで動けている」という自給自足モードを意識してください。',
                    '5分後、空腹感が心地よい安定感に変換されていることに気づくはずです。'
                ]
            },
            {
                tag: '血糖値の安定',
                title: '空腹が血糖値を「整えている」と知る',
                steps: [

let currentMode = null;
let lastIndex = -1;

function selectMode(mode) {
    currentMode = mode;
    lastIndex = -1;

    // ボディにモード設定してCSS変数を切り替え
    document.body.setAttribute('data-mode', mode);

    const info = IDEAS[mode];

    // バッジ設定
    const badge = document.getElementById('badge');
    badge.textContent = `${info.badge.emoji} ${info.badge.label}`;
    badge.style.cssText = info.badge.style;

    // 画面切替
    document.getElementById('screen-select').style.display = 'none';
    const ideaScreen = document.getElementById('screen-idea');
    ideaScreen.style.display = 'block';
    ideaScreen.classList.add('active');

    // 最初のアイデアを表示
    nextIdea();
}

function nextIdea() {
    const info = IDEAS[currentMode];
    let idx;
    do { idx = Math.floor(Math.random() * info.items.length); }
    while (idx === lastIndex && info.items.length > 1);
    lastIndex = idx;

    const item = info.items[idx];
    document.getElementById('idea-tag').textContent = item.tag;
    document.getElementById('idea-title').textContent = item.title;

    const bodyEl = document.getElementById('idea-body');
    bodyEl.innerHTML = item.steps.map((s, i) => `
        <div class="idea-step">
            <div class="step-num">${i + 1}</div>
            <div>${s}</div>
        </div>
    `).join('');

    // アニメーション再生
    const panel = document.getElementById('idea-panel');
    panel.classList.remove('slide-card');
    void panel.offsetWidth;
    panel.classList.add('slide-card');

    // Tip表示
    const tip = document.getElementById('tip-box');
    tip.textContent = info.tip;
    tip.classList.add('visible');

    // X用テキスト生成・表示
    updateCopyArea(item);

    // コピーボタンをリセット
    const btnLabel = document.getElementById('copy-btn-label');
    const btnCopy = document.getElementById('btn-copy');
    btnLabel.textContent = 'テキストをコピー';
    btnCopy.classList.remove('copied');
}

// HTMLタグを除去してプレーンテキストに変換
function stripHtml(html) {
    return html.replace(/<[^>]+>/g, '');
}

// X投稿用テキストを生成（140字以内）
// XはURLを実際の長さに関係なく常に23文字としてカウントする
const APP_URL  = 'https://szk34.github.io/hunger-creative/';
const URL_COST = 23; // Xのt.co短縮後の固定文字数

function twitterLength(text) {
    // URLを23文字として換算した実効文字数を返す
    const urlPattern = /https?:\/\/\S+/g;
    const withoutUrls = text.replace(urlPattern, '');
    const urlCount = (text.match(urlPattern) || []).length;
    return [...withoutUrls].length + urlCount * URL_COST;
}

function buildTweetText(item) {
    const tag     = item.tag;
    const title   = item.title;
    const step1   = stripHtml(item.steps[0]);
    const hashtag = '#HungerCreative';
    const url     = APP_URL;

    // フル版を構築してみる
    const full = `【${tag}】${title}\n${step1}\n${hashtag}\n${url}`;
    if (twitterLength(full) <= 140) return full;

    // step1を短縮して収める
    const base   = `【${tag}】${title}\n`;
    const suffix = `\n${hashtag}\n${url}`;
    const budget = 140 - twitterLength(base) - twitterLength(suffix) - 1; // -1 for「…」
    const trimmed = [...step1].slice(0, budget).join('') + '…';
    return `${base}${trimmed}${suffix}`;
}

function updateCopyArea(item) {
    const text = buildTweetText(item);
    const len  = twitterLength(text); // X換算の文字数で表示

    document.getElementById('copy-preview').textContent = text;

    const counter = document.getElementById('char-count');
    counter.textContent = `${len} / 140`;
    counter.classList.toggle('over', len > 140);

    document.getElementById('copy-area').classList.add('visible');
}

function copyTweet() {
    const text = document.getElementById('copy-preview').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btnLabel = document.getElementById('copy-btn-label');
        const btnCopy  = document.getElementById('btn-copy');
        btnLabel.textContent = 'コピー済み ✓';
        btnCopy.classList.add('copied');
        showToast();
    }).catch(() => {
        // fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast();
    });
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function goBack() {
    document.body.removeAttribute('data-mode');
    document.getElementById('screen-select').style.display = 'block';
    document.getElementById('screen-idea').style.display = 'none';
    document.getElementById('tip-box').classList.remove('visible');
    document.getElementById('copy-area').classList.remove('visible');
}
